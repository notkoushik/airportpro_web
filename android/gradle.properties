# FIXED gradle.properties - Remove Experimental Warnings

# Project-wide Gradle settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Build performance optimizations - FIXED JVM args
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Android optimizations
android.enableR8.fullMode=true

# ✅ REMOVED ALL EXPERIMENTAL OPTIONS that were causing warnings:
# android.overridePathCheck=true (REMOVED)
# android.disableResourceValidation=true (REMOVED)  
# android.suppressUnsupportedOptionWarnings=true (REMOVED)

# Dependency resolution
android.dependencyResolutionAtConfigurationTime=true