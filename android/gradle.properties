# gradle.properties - Fixed Version

```properties
# Project-wide Gradle settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Experimental features
android.suppressUnsupportedOptionWarnings=true

# MultiDex enable
android.defaultConfig.multiDexEnabled=true

# Build performance optimizations
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# FIXED: Only one garbage collector - removed conflicting GC options
# Using G1 garbage collector for better performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Android Build Cache
android.enableBuildCache=false

# Incremental Annotation Processing
kapt.incremental.apt=true
kapt.use.worker.api=true

# R8 optimizations
android.enableR8.fullMode=true

# Enable new incremental processing for kapt
kapt.incremental.apt=true

# Disable documentation generation for faster builds
org.gradle.configureondemand=false
```