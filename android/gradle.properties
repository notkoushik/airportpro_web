# ✅ CRITICAL: Increased heap for large dependency resolution
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2g -XX:+UseG1GC
org.gradle.parallel=true  # ✅ ENABLE parallel for dependency resolution
org.gradle.configureondemand=false
org.gradle.caching=true   # ✅ ENABLE caching for faster subsequent builds

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ✅ CRITICAL: Force Java 17 globally
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# Build optimizations
android.suppressUnsupportedOptionWarnings=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ✅ CRITICAL: Dependency optimization
android.useFullClasspathForDexingTransform=true
