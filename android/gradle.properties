# Project-wide Gradle settings

# ✅ CRITICAL: JVM settings for large Android builds with ML Kit
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2g -Dkotlin.daemon.jvm.options="-Xmx4g"

# ✅ CRITICAL: REMOVE org.gradle.java.home completely - let Gradle auto-detect
# DO NOT SET org.gradle.java.home - causes issues on Windows

# Performance settings - optimized for your setup
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX Support
android.useAndroidX=true
android.enableJetifier=true

# Android Build Optimizations
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# SDK 35 Support
android.suppressUnsupportedCompileSdk=35
android.suppressUnsupportedOptionWarnings=true

# Kotlin Configuration  
kotlin.code.style=official

# Disable unused build features for faster builds
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# File system compatibility
org.gradle.vfs.watch=true