# Project-wide Gradle settings

# ✅ CRITICAL: Increase memory and file handling for Windows
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options="-Xmx2g"

# ✅ Windows-specific settings for file locking issues  
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=false
org.gradle.configuration-cache=false

# AndroidX Support
android.useAndroidX=true
android.enableJetifier=true

# Android Build Optimizations
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# SDK 35 Support
android.suppressUnsupportedCompileSdk=35
android.suppressUnsupportedOptionWarnings=true

# Kotlin Configuration  
kotlin.code.style=official

# Disable unused build features
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ✅ Windows file system compatibility
org.gradle.vfs.watch=false