# CORRECTED gradle.properties - FIXED Version

# Project-wide Gradle settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Experimental features
android.suppressUnsupportedOptionWarnings=true

# Build performance optimizations
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# REMOVED deprecated android.enableBuildCache (was causing warning)
# android.enableBuildCache=false

# Incremental Annotation Processing
kapt.incremental.apt=true
kapt.use.worker.api=true

# R8 optimizations
android.enableR8.fullMode=true

# Repository configuration
android.overridePathCheck=true

# Disable warning about using deprecated APIs (for now)
android.disableResourceValidation=true