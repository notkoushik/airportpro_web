# Gradle Performance
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2g
org.gradle.parallel=false # ✅ CRITICAL: Disable for cache issues
org.gradle.configureondemand=false
org.gradle.caching=false # ✅ CRITICAL: Disable problematic caching

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ✅ CRITICAL: Force Java 17 globally
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot
org.gradle.java.installations.paths=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# ✅ CRITICAL: Force Java 17 toolchain
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false

# Build optimizations
android.suppressUnsupportedOptionWarnings=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ✅ CRITICAL: Disable all cache types
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false
org.gradle.build-cache=false

# ✅ ADD: Enable multidex for large dependencies
android.enableDexingArtifactTransform.desugaring=false
