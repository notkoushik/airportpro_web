plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: '../variables.gradle'

android {
    namespace "com.airportpro.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.airportpro.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation "androidx.core:core-ktx:${androidxCoreVersion}"
    implementation "androidx.core:core-splashscreen:${coreSplashScreenVersion}"
    implementation "androidx.appcompat:appcompat:${androidxAppCompatVersion}"
    implementation "androidx.activity:activity-ktx:${androidxActivityVersion}"
    implementation "androidx.fragment:fragment-ktx:${androidxFragmentVersion}"

    // ✅ FIXED: Only include modules that actually exist
    implementation project(':capacitor-android')
    implementation project(':capacitor-camera')
    implementation project(':capacitor-device')
    
    // ✅ REMOVED: This line was causing the error
    // implementation project(':capacitor-cordova-android-plugins')  // ❌ This doesn't exist

    // Test dependencies
    testImplementation "junit:junit:${junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidxEspressoCoreVersion}"
}

apply from: 'capacitor.build.gradle'
