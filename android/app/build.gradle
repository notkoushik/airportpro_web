plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: '../variables.gradle'

android {
    namespace "com.airportpro.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.airportpro.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ✅ CRITICAL: Force Java 17 explicitly
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation "androidx.core:core-ktx:${androidxCoreVersion}"
    implementation "androidx.core:core-splashscreen:${coreSplashScreenVersion}"
    implementation "androidx.appcompat:appcompat:${androidxAppCompatVersion}"
    implementation "androidx.activity:activity-ktx:${androidxActivityVersion}"
    implementation "androidx.fragment:fragment-ktx:${androidxFragmentVersion}"

    // Capacitor modules
    implementation project(':capacitor-android')
    implementation project(':capacitor-camera')
    implementation project(':capacitor-device')

    // ✅ ADD: ML Kit dependencies for face detection and text recognition
    implementation 'com.google.mlkit:face-detection:16.1.6'
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // ✅ ADD: BouncyCastle for passport/crypto operations
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    // ✅ ADD: JMRTD for passport NFC reading
    implementation 'org.jmrtd:jmrtd:0.7.34'
    implementation 'net.sf.scuba:scuba-sc-android:0.0.23'

    // Test dependencies
    testImplementation "junit:junit:${junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidxEspressoCoreVersion}"
}

apply from: 'capacitor.build.gradle'
