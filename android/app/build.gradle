// The plugins block must be first.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

apply from: 'capacitor.build.gradle'

android {
    // 👇 Must match your folder path com/airportpro/app
    namespace "com.airportpro.app"

    // Newer androidx.core requires 35+
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.airportpro.app"
        minSdkVersion 23          // Capacitor plugins require ≥ 23
        targetSdkVersion 35

        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug { debuggable true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lintOptions { abortOnError false }
}

dependencies {
    // Capacitor core
    implementation project(':capacitor-android')

    // AndroidX + Material
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Needed because styles.xml uses Theme.SplashScreen
    implementation "androidx.core:core-splashscreen:1.0.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
