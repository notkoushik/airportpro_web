plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: '../variables.gradle'

android {
    // ✅ CRITICAL: Match capacitor.config.ts
    namespace 'com.airportpro.app'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // ✅ CRITICAL: Match capacitor.config.ts
        applicationId "com.airportpro.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // ✅ MULTIDEX: Required for large apps
        multiDexEnabled true
        
        aaptOptions {
            ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
        }
    }

    // ✅ CRITICAL: Java 17 consistency
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    // ✅ CRITICAL: Override any source release issues
    tasks.withType(JavaCompile) {
        options.release = null
        options.compilerArgs.removeAll { it.startsWith("--release") }
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage'
    }

    packagingOptions {
        resources {
            // ✅ NATIVE LIBS: Handle conflicts
            pickFirst '**/libc++_shared.so'
            pickFirst '**/libjsc.so'
            
            // ✅ META-INF: Exclude duplicates
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 
                        'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

// ✅ CRITICAL: BouncyCastle version resolution
configurations.all {
    resolutionStrategy {
        // ✅ FORCE: Single BouncyCastle version
        force 'org.bouncycastle:bcprov-jdk15on:1.70'
        force 'org.bouncycastle:bcpkix-jdk15on:1.70'
        force 'org.bouncycastle:bcutil-jdk15on:1.70'
        
        eachDependency { details ->
            if (details.requested.group == 'org.bouncycastle') {
                // ✅ FORCE: Use JDK15on for compatibility
                if (details.requested.name.contains('jdk18on')) {
                    details.useTarget group: 'org.bouncycastle', 
                                   name: details.requested.name.replace('jdk18on', 'jdk15on'), 
                                   version: '1.70'
                }
            }
        }
    }
}

dependencies {
    implementation project(':capacitor-android')

    // ✅ CORE: Updated Android dependencies
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "androidx.fragment:fragment-ktx:$androidxFragmentVersion"

    // ✅ UI: Material Design
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ✅ LIFECYCLE: Architecture components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.5'

    // ✅ WEBVIEW: Enhanced web support
    implementation 'androidx.webkit:webkit:1.11.0'

    // ✅ SECURITY: Production-ready encryption
    implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'

    // ✅ ML KIT: Google's AI services
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ✅ BOUNCYCASTLE: Consistent versions
    implementation('org.bouncycastle:bcprov-jdk15on:1.70') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation('org.bouncycastle:bcpkix-jdk15on:1.70') {
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    }

    // ✅ NFC PASSPORT: JMRTD with exclusions
    implementation('org.jmrtd:jmrtd:0.7.34') {
        exclude group: 'org.bouncycastle'
    }
    implementation('net.sf.scuba:scuba-sc-android:0.0.23') {
        exclude group: 'org.bouncycastle'
    }

    // ✅ TENSORFLOW: AI processing
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation('org.tensorflow:tensorflow-lite-support:0.4.4') {
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    }

    // ✅ COROUTINES: Async processing
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ✅ MULTIDEX: Large app support
    implementation 'androidx.multidex:multidex:2.0.1'

    // ✅ TESTING: Comprehensive test suite
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

apply from: 'capacitor.build.gradle'
