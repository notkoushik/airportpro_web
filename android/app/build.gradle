plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: '../variables.gradle'

android {
    namespace "com.airportpro.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.airportpro.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // ✅ CRITICAL: Enable multidex for large app
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ✅ CRITICAL: Force Java 17 explicitly
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // ✅ FIXED: Correct multidex dependency (was multidx)
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ✅ STREAMLINED: Only essential dependencies
    implementation "androidx.core:core-ktx:${androidxCoreVersion}"
    implementation "androidx.core:core-splashscreen:${coreSplashScreenVersion}"
    implementation "androidx.appcompat:appcompat:${androidxAppCompatVersion}"
    implementation "androidx.activity:activity-ktx:${androidxActivityVersion}"
    implementation "androidx.fragment:fragment-ktx:${androidxFragmentVersion}"

    // ✅ CAPACITOR: Core modules only
    implementation project(':capacitor-android')
    implementation project(':capacitor-camera')
    implementation project(':capacitor-device')

    // ✅ ESSENTIAL ONLY: Minimal ML Kit (for basic functionality)
    implementation 'com.google.mlkit:face-detection:16.1.6'
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // ✅ REMOVED: Heavy dependencies causing build issues
    // Temporarily removed BouncyCastle and JMRTD to get build working
    // These can be added back individually after successful build

    // Test dependencies
    testImplementation "junit:junit:${junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidxEspressoCoreVersion}"
}

apply from: 'capacitor.build.gradle'
