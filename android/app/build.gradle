plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ✅ CRITICAL: Java toolchain enforces Java 21 for ALL compilation tasks
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace "com.airportpro.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.airportpro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ✅ CRITICAL: Align both Java and Kotlin to 21
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21  // CHANGED FROM 17 TO 21
        targetCompatibility JavaVersion.VERSION_21  // CHANGED FROM 17 TO 21
    }

    kotlinOptions {
        jvmTarget = '21'  // CHANGED FROM '17' TO '21'
    }
}
def camerax_version = "1.3.1"
implementation "androidx.camera:camera-core:${camerax_version}"
implementation "androidx.camera:camera-camera2:${camerax_version}"
implementation "androidx.camera:camera-lifecycle:${camerax_version}"
implementation "androidx.camera:camera-view:${camerax_version}"

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "androidx.fragment:fragment-ktx:$androidxFragmentVersion"
    dependencies {
    // Your existing dependencies...
    
    // 🔥 NFC Passport Reading - EXACT WORKING VERSIONS
    implementation "org.jmrtd:jmrtd:0.7.20"
    implementation "net.sf.scuba:scuba-sc-android:0.0.20"
    
    // Cryptography (BouncyCastle)
    implementation "org.bouncycastle:bcprov-jdk15on:1.70"
    implementation "org.bouncycastle:bcpkix-jdk15on:1.70"
}

    
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    
    // ✅ FIXED: Correct ML Kit versions
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:face-detection:16.1.6'
    
    // Camera X for enhanced camera functionality
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    
    // NFC and passport reading
    implementation 'net.sf.scuba:scuba-sc-android:0.0.25'
    
    // Coroutines for async operations (REQUIRED for PassportScannerPlugin)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}



apply from: 'capacitor.build.gradle'
