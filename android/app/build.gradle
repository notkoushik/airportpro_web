plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.airportpro.web'
    compileSdk 35

    defaultConfig {
        applicationId "io.airportpro.web"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    tasks.withType(JavaCompile) {
        options.release = null
        options.compilerArgs.removeAll { it.startsWith("--release") }
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.compilerArgs += ['-source', '17', '-target', '17']
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage'
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        // CRITICAL: Exclude duplicate BouncyCastle files
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        pickFirst '**/bcprov-*.jar'
        pickFirst '**/bcpkix-*.jar'
    }
}

apply from: 'capacitor.build.gradle'

// CRITICAL: Force consistent BouncyCastle version resolution
configurations.all {
    resolutionStrategy {
        // Force all BouncyCastle modules to use the same version
        force 'org.bouncycastle:bcprov-jdk18on:1.78'
        force 'org.bouncycastle:bcpkix-jdk18on:1.78'
        force 'org.bouncycastle:bcutil-jdk18on:1.78'
        
        // Exclude older versions that cause conflicts
        eachDependency { details ->
            if (details.requested.group == 'org.bouncycastle') {
                if (details.requested.name.contains('jdk15on') || 
                    details.requested.version == '1.70' || 
                    details.requested.version == '1.71') {
                    details.useVersion '1.78'
                    details.because 'Force consistent BouncyCastle version to avoid duplicate classes'
                }
            }
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Capacitor dependencies
    implementation project(':capacitor-android')
    implementation project(':capacitor-camera')
    implementation project(':capacitor-device')
    
    // ML Kit dependencies for face and text recognition
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    
    // CRITICAL: Use consistent BouncyCastle version (JDK18 compatible)
    implementation('org.bouncycastle:bcprov-jdk18on:1.78') {
        // Exclude any conflicting transitive dependencies
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    implementation('org.bouncycastle:bcpkix-jdk18on:1.78') {
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    }
    
    // JMRTD library with BouncyCastle exclusions
    implementation('org.jmrtd:jmrtd:0.7.34') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    }
    implementation('net.sf.scuba:scuba-sc-android:0.0.23') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    }
    
    // Android Architecture Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
