// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
// HOWEVER, we need to override the Java version for compatibility

// ✅ FORCE all Capacitor modules to use Java 17
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ✅ FORCE Kotlin to match Java 17
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
        jvmTarget = '17'
    }
}

// ✅ FORCE Java compilation tasks to use Java 17
tasks.withType(JavaCompile) {
    options.release = null
    options.compilerArgs.removeAll { it.startsWith("--release") }
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

dependencies {
    implementation project(':capacitor-camera')
    implementation project(':capacitor-device')
}

if (hasProperty('postBuildExtras')) {
    postBuildExtras()
}
