// Top-level build file
plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'com.android.library' version '8.7.2' apply false  
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://www.jitpack.io' }
        // ✅ ADD: BouncyCastle specific repository
        maven { url 'https://repo1.maven.org/maven2/' }
    }
    
    // ✅ CRITICAL: Force Java 17 for ALL projects
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        
        // ✅ FORCE: Override Java compilation globally
        project.tasks.withType(JavaCompile) {
            options.release = null
            options.compilerArgs.removeAll { it.startsWith("--release") }
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
        
        // ✅ FORCE: Kotlin compilation consistency
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
