// Top-level build file
plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'com.android.library' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

// CRITICAL: Configure all projects to use Java 17
allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    
    // Force Java 17 for ALL subprojects including Capacitor modules
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        
        // Override any tasks that might try to use source release 21
        project.tasks.withType(JavaCompile) {
            options.release = null
            options.compilerArgs.removeAll { it.startsWith("--release") }
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
