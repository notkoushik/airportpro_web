pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // We'll keep JitPack for any other dependencies, just in case
        maven { url 'https://jitpack.io' }

        // Node.js repository for node-gradle plugin
        maven {
            url 'https://www.idpass.io/maven/idpass-smartscanner'
        }
        ivy {
            name = "Node.js"
            setUrl("https://nodejs.org/dist/")
            patternLayout {
                artifact("v[revision]/[artifact](-v[revision]-[classifier]).[ext]")
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule("org.nodejs", "node")
            }
        }

        flatDir {
            dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
        }
    }
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')

// --- ADD THESE TWO LINES ---
include ':idpass-smartscanner-capacitor'
project(':idpass-smartscanner-capacitor').projectDir = new File('../node_modules/@idpass/smartscanner-capacitor/android')
// --- END OF ADDITION ---

apply from: 'capacitor.settings.gradle'