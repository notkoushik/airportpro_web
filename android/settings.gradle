pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()

        // This is the key fix: Define what 'jcenter()' should do.
        // In this case, we are redirecting it to mavenCentral.
        // This resolves the error for plugins that still call jcenter().
        jcenter {
            content {
                includeGroup "com.bignerdranch.android"
            }
        }

        // ADD flatDir here to centralize it
        flatDir {
            dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
        }
    }
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
