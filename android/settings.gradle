

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

rootProject.name = 'AirportPro'
include ':app'

// Include Capacitor modules
def capacitorProjects = file('../node_modules/@capacitor')
if (capacitorProjects.exists()) {
    capacitorProjects.eachFileRecurse { file ->
        if (file.isDirectory() && new File(file, 'android').exists()) {
            include ":${file.name}"
            project(":${file.name}").projectDir = new File(file, 'android')
        }
    }
}