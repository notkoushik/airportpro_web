pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // ✅ CRITICAL FIX: Change to FAIL_ON_PROJECT_REPOS to allow proper repository resolution
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // ✅ Add ML Kit specific repository
        maven { url "https://dl.google.com/dl/android/maven2/" }
        // ✅ Add additional Maven repositories for ML Kit dependencies
        maven { url "https://maven.google.com" }
    }
}

rootProject.name = "android"

include ':app'

// Include all Capacitor subprojects (auto-generated by cap sync)
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')

include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')

include ':capacitor-camera'
project(':capacitor-camera').projectDir = new File('../node_modules/@capacitor/camera/android')

include ':capacitor-device'
project(':capacitor-device').projectDir = new File('../node_modules/@capacitor/device/android')